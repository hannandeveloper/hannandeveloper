name: Total Stars Counter

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Count total stars
        uses: actions/github-script@v7
        with:
          script: |
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: 'hannandeveloper',
              per_page: 100
            });
            let totalStars = 0;
            repos.forEach(repo => {
              if (!repo.fork) { totalStars += repo.stargazers_count; }
            });

            const fs = require('fs');
            if (!fs.existsSync('stats')) fs.mkdirSync('stats');
            fs.writeFileSync('stats/stars.json', JSON.stringify({ stars: totalStars }));
            console.log(`Total stars: ${totalStars}`);

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats/stars.json
          git commit -m "Update total stars" || echo "No changes"
          git push
